<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1430"/>
      <stop offset="0.55" stop-color="#16122a"/>
      <stop offset="1" stop-color="#3a0c14"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c2d6"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a4a"/>
      <stop offset="1" stop-color="#b3121b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="220" rx="18" fill="url(#bg)"/>
  <!-- a championship belt -->
  <g transform="translate(92 110)">
    <rect x="-70" y="-16" width="140" height="32" rx="10" fill="#1d1d1f" stroke="#3a3a3f" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="42" ry="34" fill="#d8b04a" stroke="#8a6a1c" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="30" ry="23" fill="#f2d57a" stroke="#b28b2a" stroke-width="2"/>
    <polygon points="0,-14 4,-4 14,-4 6,2 9,12 0,6 -9,12 -6,2 -14,-4 -4,-4" fill="#b3121b"/>
    <circle cx="-56" cy="0" r="7" fill="#d8b04a"/>
    <circle cx="56" cy="0" r="7" fill="#d8b04a"/>
  </g>
  <text x="180" y="90" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="44" fill="url(#chrome)">SmackDown <tspan fill="url(#red)">vs.</tspan> Raw 2011</text>
  <text x="182" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#dfe4f2">A native PC port of the 2010 Xbox 360 game</text>
  <text x="182" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#a9b1c9">Bring your own disc  ·  Up to 4K, 60 fps  ·  Launcher  ·  Your own entrance music &amp; movies  ·  10 HD logos</text>
</svg>
