<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93aa"/>
    </marker>
  </defs>
  <rect width="960" height="260" rx="14" fill="#f4f6fa"/>
  <!-- music row -->
  <g transform="translate(30 28)">
    <rect width="230" height="88" rx="10" fill="#ffffff" stroke="#c3cad8" stroke-width="2"/>
    <path d="M18 28 h26 l6 6 h26 v30 h-58 z" fill="#8fb3ff" stroke="#3f6fd8" stroke-width="2"/>
    <text x="92" y="42" font-size="15" font-weight="600" fill="#1f2638">Music\</text>
    <text x="92" y="62" font-size="12" fill="#5d6680">My Theme\song.mp3</text>
  </g>
  <line x1="268" y1="72" x2="318" y2="72" stroke="#8a93aa" stroke-width="3" marker-end="url(#arr)"/>
  <g transform="translate(326 28)">
    <rect width="604" height="88" rx="10" fill="#16192a"/>
    <text x="20" y="36" font-size="15" font-weight="600" fill="#ffffff">CREATE AN ENTRANCE → FINALIZE → MUSIC → USER PLAYLIST</text>
    <text x="20" y="62" font-size="13" fill="#b9c0d6">Each folder is a song you can pick; it plays in the entrance and the preview.</text>
  </g>
  <!-- movie row -->
  <g transform="translate(30 144)">
    <rect width="230" height="88" rx="10" fill="#ffffff" stroke="#c3cad8" stroke-width="2"/>
    <rect x="22" y="22" width="60" height="44" rx="4" fill="#26324f"/>
    <polygon points="44,32 44,56 64,44" fill="#ff4a4a"/>
    <text x="100" y="42" font-size="15" font-weight="600" fill="#1f2638">any video</text>
    <text x="100" y="62" font-size="12" fill="#5d6680">Launcher → Movies</text>
  </g>
  <line x1="268" y1="188" x2="318" y2="188" stroke="#8a93aa" stroke-width="3" marker-end="url(#arr)"/>
  <g transform="translate(326 144)">
    <rect width="604" height="88" rx="10" fill="#16192a"/>
    <text x="20" y="36" font-size="15" font-weight="600" fill="#ffffff">CREATE AN ENTRANCE → FINALIZE → MOVIE → your movie, after NONE</text>
    <text x="20" y="62" font-size="13" fill="#b9c0d6">It plays on the arena's big screen; a strip of your choice goes on the stage and ramp.</text>
  </g>
</svg>
